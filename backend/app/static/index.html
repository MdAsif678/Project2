    const { useState, useEffect, useRef } = React;

    // Background Physics Constellation Canvas Component
    function ConstellationCanvas() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const nodes = [];
        const nodeCount = Math.min(150, Math.floor((width * height) / 12000));
        for (let i = 0; i < nodeCount; i++) {
          nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            radius: Math.random() * 1.5 + 0.5,
            color: Math.random() > 0.85 ? '#ff0040' : Math.random() > 0.6 ? '#6366f1' : '#00ff88'
          });
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < nodes.length; i++) {
            const node = nodes[i];
            node.x += node.vx;
            node.y += node.vy;

            if (node.x < 0) node.x = width;
            if (node.x > width) node.x = 0;
            if (node.y < 0) node.y = height;
            if (node.y > height) node.y = 0;

            ctx.beginPath();
            ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
            ctx.fillStyle = node.color;
            ctx.fill();

            for (let j = i + 1; j < nodes.length; j++) {
              const other = nodes[j];
              const dx = other.x - node.x;
              const dy = other.y - node.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 130) {
                ctx.beginPath();
                ctx.moveTo(node.x, node.y);
                ctx.lineTo(other.x, other.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - dist / 130)})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

          {/* CBOM Explorer Table */}
          <section className="max-w-7xl mx-auto px-6 mb-16 relative z-10">
            <div className="glass-panel p-6 sm:p-8">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-white/[0.06]">
                <div>
                  <h2 className="text-2xl font-heading font-bold text-white">Cryptography Bill of Materials (CBOM)</h2>
                  <p className="text-xs text-white/50 font-mono mt-0.5">OWASP CycloneDX v1.6 Standard • {findings.length} Classified Cryptographic Assets</p>
                </div>
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Filter algorithm or file..."
                  className="px-3.5 py-2 bg-white/[0.03] border border-white/[0.08] rounded-xl text-xs font-mono text-white focus:outline-none"
                />
              </div>

              <div className="overflow-x-auto mt-4">
                <table className="w-full text-left text-xs font-mono">
                  <thead>
                    <tr className="border-b border-white/[0.06] text-white/40 uppercase text-[11px]">
                      <th className="py-3 px-3">Cryptographic Asset</th>
                      <th className="py-3 px-3">Primitive Category</th>
                      <th className="py-3 px-3">Classical Strength</th>
                      <th className="py-3 px-3">Threat Classification</th>
                      <th className="py-3 px-3">Target NIST PQC Standard</th>
                      <th className="py-3 px-3 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-white/[0.04]">
                    {filteredFindings.map(f => (
                      <tr key={f.id} className="hover:bg-white/[0.02] transition-colors">
                        <td className="py-3.5 px-3">
                          <div className="font-bold text-white">{f.algorithm}</div>
                          <div className="text-[10px] text-white/40">{f.file_path || 'Network Endpoint'}</div>
                        </td>
                        <td className="py-3.5 px-3 text-indigo-200">{f.primitive}</td>
                        <td className="py-3.5 px-3 text-white/70">
                          {f.classical_security_bits ? `~${f.classical_security_bits}-bit` : 'N/A'}
                        </td>
                        <td className="py-3.5 px-3">
                          <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                            f.risk_level.includes('SHOR') ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                            f.risk_level.includes('GROVER') ? 'bg-amber-500/20 text-amber-400' :
                            f.risk_level.includes('RESISTANT') ? 'bg-emerald-500/20 text-emerald-400' : 'bg-zinc-500/20 text-zinc-300'
                          }`}>
                            {f.risk_level}
                          </span>
                        </td>
                        <td className="py-3.5 px-3 text-indigo-300 font-semibold">{f.nist_replacement}</td>
                        <td className="py-3.5 px-3 text-right">
                          <button
                            onClick={() => openRemediation(f)}
                            className="px-3 py-1 rounded-lg bg-indigo-600/30 hover:bg-indigo-600 text-white font-semibold text-xs transition-all cursor-pointer"
                          >
                            🪄 Patch
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          {/* AI Remediation Diff Modal */}
          {selectedFinding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl">
              <div className="glass-panel w-full max-w-5xl max-h-[90vh] flex flex-col p-6 border border-white/[0.12] shadow-2xl">
                <div className="flex justify-between items-center pb-4 border-b border-white/[0.08]">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🪄</span>
                    <div>
                      <h3 className="text-lg font-heading font-bold text-white">
                        PQC Migration Suggestion: {selectedFinding.algorithm} ({selectedFinding.primitive})
                      </h3>
                      <div className="text-[11px] text-amber-400/90 font-mono">
                        ⚠️ AI-assisted migration patch requiring developer validation and unit testing.
                      </div>
                    </div>
                  </div>
                  <button onClick={() => setSelectedFinding(null)} className="text-white/50 hover:text-white text-lg">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto py-4 space-y-4 font-mono text-xs">
                  {remediation ? (
                    <div>
                      <div className="grid grid-cols-2 gap-4 mb-4">
                        <div className="p-3 rounded-xl bg-red-500/5 border border-red-500/20">
                          <div className="text-red-400 font-bold mb-1">🔴 Legacy Cryptographic Code</div>
                          <pre className="text-white/80 whitespace-pre-wrap">{remediation.original_code}</pre>
                        </div>
                        <div className="p-3 rounded-xl bg-emerald-500/5 border border-emerald-500/20">
                          <div className="text-emerald-400 font-bold mb-1">🟢 Post-Quantum Remediated ({remediation.target_fips})</div>
                          <pre className="text-emerald-200 whitespace-pre-wrap">{remediation.patched_code}</pre>
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-white/[0.02] border border-white/[0.06] text-white/80 font-sans leading-relaxed">
                        <div className="font-bold text-white font-mono mb-1">NIST Technical Rationale:</div>
                        {remediation.why_vulnerable}
                      </div>

                      <div className="p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex justify-between items-center text-xs font-mono text-indigo-300">
                        <span>Standard: <strong>{remediation.nist_reference}</strong></span>
                        <a href={remediation.nist_link} target="_blank" rel="noopener noreferrer" className="underline hover:text-white">
                          View NIST CSRC Specification ↗
                        </a>
                      </div>
                    </div>
                  ) : (
                    <div className="text-center py-12 text-white/50">Synthesizing NIST PQC Patch with Gemini Engine...</div>
                  )}
                </div>

                <div className="pt-4 border-t border-white/[0.08] flex justify-end gap-3">
                  <button
                    onClick={() => {
                      if (remediation) navigator.clipboard.writeText(remediation.patched_code);
                      alert('Patched code copied to clipboard!');
                    }}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg"
                  >
                    📋 Copy Patched Code
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="text-center py-8 text-xs font-mono text-white/40 border-t border-white/[0.06]">
            © 2026 Aegis-Q • Smart India Hackathon (SIH26164) • 100% Free Tier Architecture
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
